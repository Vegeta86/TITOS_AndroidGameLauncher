  <text x="600" y="222" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" fill="url(#accent)">Tu consola Android, transformada</text>
  <text x="600" y="262" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9ea3af">Pensado para mandos físicos · Sin anuncios · Gratis</text>
